<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing - Qonna</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .detail { background: white; border-radius: 14px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.06); text-align: left; }
        .detail h2 { margin: 6px 0 4px; color: #2E7D32; }
        .price { font-size: 26px; font-weight: bold; color: #2E7D32; margin: 10px 0; }
        .row { padding: 8px 0; border-bottom: 1px solid #eee; color: #333; }
        .row b { color: #555; }
        .actions { display: flex; gap: 10px; margin-top: 16px; }
        .actions a { flex: 1; text-align: center; padding: 14px; border-radius: 10px; color: white; text-decoration: none; font-weight: bold; }
        .call { background: #2E7D32; }
        .sms { background: #1565C0; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 13px; color: white; }
        .tag.sell { background: #2E7D32; }
        .tag.buy { background: #EF6C00; }
        .msg { color: #666; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-brand">🌱 Qonna</div>
        <a href="listings.html" class="btn-dash">Back / Deebi'i</a>
    </div>

    <div class="container">
        <div id="box" class="msg">Loading... / Fe'aa jira...</div>
    </div>

    <script>
        const API = "https://qonna-dijitaalaa.onrender.com";
        const id = new URLSearchParams(location.search).get("id");
        const box = document.getElementById("box");
        const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
            c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        function render(l) {
            const phone = String(l.contact || "").replace(/\s+/g, "");
            const isSell = l.action === "sell";
            box.className = "detail";
            box.innerHTML = `
                <span class="tag ${isSell ? 'sell' : 'buy'}">${isSell ? 'Selling / Gurguruu' : 'Buying / Bituu'}</span>
                <h2>${esc(l.name)}</h2>
                <div class="price">${Number(l.price).toLocaleString()} ETB</div>
                <div class="row"><b>Quantity / Baay'ina:</b> ${esc(l.quantity || "-")} ${esc(l.unit || "")}</div>
                <div class="row"><b>Category / Gosa:</b> ${esc(l.category)}</div>
                <div class="row"><b>Seller / Gurguruu:</b> ${esc(l.seller)}</div>
                <div class="row"><b>Sub-city / Naannoo:</b> ${esc(l.sub_city)}</div>
                <div class="row"><b>Details / Ibsa:</b> ${esc(l.description || "-")}</div>
                <div class="actions">
                    <a class="call" href="tel:${encodeURIComponent(phone)}">📞 Call / Bilbili</a>
                    <a class="sms" href="sms:${encodeURIComponent(phone)}">💬 SMS</a>
                </div>`;
        }

        async function load() {
            if (!id) { box.textContent = "Listing not found. / Hin argamne."; return; }
            try {
                const res = await fetch(API + "/listing/" + encodeURIComponent(id));
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Not found");
                render(data.listing);
            } catch (e) {
                box.textContent = "Could not load. Try again in a minute. / Irra deebi'ii yaali.";
            }
        }
        load();
    </script>
</body>
</html>
