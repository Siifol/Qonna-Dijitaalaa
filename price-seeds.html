<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Prices - Qonna Dijitaalawaa Shaggar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-bar { width: 100%; padding: 15px; margin-bottom: 10px; border: 2px solid #2E7D32; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .seed-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .seed-info h4 { margin: 0; color: #2E7D32; }
        .seed-info p { margin: 0; font-size: 13px; color: #666; }
        .price-tag { font-weight: bold; color: #333; white-space: nowrap; }
        .action-btn { background: #2E7D32; color: white; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">🌱 Qonna Dijitaalawaa Shaggar</div>
        <a href="market-prices.html" class="btn-dash">Back</a>
    </div>

    <div class="container">
        <h2>Seed Registry</h2>
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search seeds (e.g. Teff, Wheat)...">
        <p id="priceNote" style="font-size:12px;color:#777;"></p>
        <div id="priceList" data-category="seeds"></div>
    </div>

    <script src="seed-data.js"></script>
    <script src="materials-data.js"></script>
    <script src="chemicals-data.js"></script>
    <script src="price-list.js"></script>
</body>
</html>
