<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing - Qonna</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .detail { background: white; border-radius: 14px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.06); text-align: left; }
        .detail h2 { margin: 10px 0 8px; color: #1B5E20; font-size: 24px; }
        .price-box { background: #E8F5E9; border-radius: 12px; padding: 16px; text-align: center; margin: 8px 0 12px; }
        .price-box .amount { font-size: 36px; font-weight: bold; color: #1B5E20; line-height: 1.1; }
        .price-box .per { font-size: 17px; color: #2E7D32; margin-top: 2px; }
        .price-box .total { display: inline-block; margin-top: 10px; background: #2E7D32; color: white; padding: 6px 14px; border-radius: 20px; font-size: 14px; }
        .row { padding: 10px 0; border-bottom: 1px solid #eee; color: #333; font-size: 15px; }
        .row b { color: #555; display: block; font-size: 13px; font-weight: normal; }
        .reveal { width: 100%; margin-top: 18px; padding: 16px; border: none; border-radius: 12px; background: #2E7D32; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        .contact-box { margin-top: 14px; text-align: center; }
        .contact-line { font-size: 20px; font-weight: bold; color: #1B5E20; margin-bottom: 12px; word-break: break-all; }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        .actions a { display: block; text-align: center; padding: 16px; border-radius: 12px; color: white; text-decoration: none; font-weight: bold; font-size: 18px; }
        .call { background: #2E7D32; }
        .sms { background: #1565C0; }
        .mail { background: #6A1B9A; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 13px; color: white; }
        .tag.sell { background: #2E7D32; }
        .tag.buy { background: #EF6C00; }
        .msg { color: #666; padding: 20px; text-align: center; }
        .offer-box { background: white; border-radius: 14px; padding: 18px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); text-align: left; }
        .offer-box h3 { margin: 0 0 12px; color: #2E7D32; }
        .offer-box label { display: block; margin: 10px 0 4px; color: #555; font-size: 14px; }
        .offer-box select, .offer-box input, .offer-box textarea {
            width: 100%; padding: 12px; border: 1px solid #DCE2DC; border-radius: 8px; font-size: 16px; box-sizing: border-box; font-family: inherit;
        }
        .offer-box button { width: 100%; margin-top: 14px; padding: 14px; border: none; border-radius: 10px; background: #EF6C00; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .offer-msg { margin-top: 10px; padding: 10px; border-radius: 8px; display: none; }
        .offer-msg.ok { background: #E8F5E9; color: #2E7D32; display: block; }
        .offer-msg.bad { background: #FDF2F2; color: #D32F2F; display: block; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-brand">🌱 Qonna</div>
        <div>
            <button id="langBtn" class="btn-dash">Afaan Oromoo</button>
            <a href="listings.html" id="backLink" class="btn-dash">Back</a>
        </div>
    </div>

    <div class="container">
        <div id="box" class="msg">Loading...</div>
        <div id="offerArea"></div>
    </div>

    <script>
        const API = "https://qonna-dijitaalaa.onrender.com";
        const id = new URLSearchParams(location.search).get("id");
        const box = document.getElementById("box");
        const offerArea = document.getElementById("offerArea");
        let lang = sessionStorage.getItem("lang") || "en";
        let current = null;

        const T = {
            en: { back: "Back", contactSeller: "📞 Contact seller", callSeller: "📞 Call seller", sms: "💬 SMS", emailSeller: "✉️ Email seller",
                  seller: "Seller", area: "Sub-city", total: "Total for sale", cat: "Category", details: "Details",
                  posted: "Posted on", sell: "Selling", buy: "Buying", per: "per",
                  loading: "Loading...", notFound: "Listing not found.", error: "Could not load. Please try again.",
                  noContact: "No contact given.", switchTo: "Afaan Oromoo",
                  offerTitle: "Make an offer or ask for a discount", kind: "Request type", kindOffer: "Make an offer",
                  kindDiscount: "Ask for a discount", amountLabel: u => `Your price per ${u} (ETB)`,
                  message: "Message (optional)", send: "Send request", login: "Log in to send a request.", loginLink: "Log in",
                  sent: "Request sent.", failed: "Could not send. Please try again.", own: "This is your own listing." },
            om: { back: "Duubatti", contactSeller: "📞 Gurguruu quunnamuu", callSeller: "📞 Gurguruu bilbili", sms: "💬 SMS", emailSeller: "✉️ Gurguruu emaili",
                  seller: "Gurguruu", area: "Naannoo", total: "Waliigala gurguramu", cat: "Gosa", details: "Ibsa",
                  posted: "Guyyaa galmeessame", sell: "Gurguruu", buy: "Bitaa", per: "tokkoof",
                  loading: "Fe'aa jira...", notFound: "Oduun kun hin argamne.", error: "Fe'uun hin danda'amne. Irra deebi'ii yaali.",
                  noContact: "Quunnamtiin hin kennamne.", switchTo: "English",
                  offerTitle: "Gatii kennii ykn rifeensa gaafadhu", kind: "Gosa gaaffii", kindOffer: "Gatii kennii",
                  kindDiscount: "Rifeensa gaafadhu", amountLabel: u => `Gatii keessan ${u} tokkoof (ETB)`,
                  message: "Ergaa (filannoo)", send: "Gaaffii ergi", login: "Gaaffii erguuf seenaa.", loginLink: "Seeni",
                  sent: "Gaaffiin ergameera.", failed: "Ergamuu hin danda'amne. Irra deebi'ii yaali.", own: "Oduun kee kana." }
        };
        const CATS = {
            seeds: { en: "Seeds", om: "Sanyii" },
            materials: { en: "Farm Materials", om: "Meeshaa qonnaa" },
            fertilizer: { en: "Fertilizer", om: "Ajaa'ib" },
            produce: { en: "Produce", om: "Oomisha" }
        };

        const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
            c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        function getUser() {
            try { return JSON.parse(localStorage.getItem("activeUser")); } catch (e) { return null; }
        }

        function show(text) {
            box.className = "msg";
            box.textContent = text;
        }

        function contactSection(raw, tr) {
            const value = String(raw || "").trim();
            const phone = value.replace(/[\s-]/g, "");
            const isPhone = /^\+?\d{7,15}$/.test(phone);
            const isEmail = value.includes("@");
            if (!isPhone && !isEmail) {
                return `<div class="contact-box">${tr.noContact}</div>`;
            }
            const buttons = isPhone
                ? `<a class="call" href="tel:${phone}">${tr.callSeller}</a>
                   <a class="sms" href="sms:${phone}">${tr.sms}</a>`
                : `<a class="mail" href="mailto:${encodeURIComponent(value)}">${tr.emailSeller}</a>`;
            return `
                <button id="revealBtn" class="reveal" type="button">${tr.contactSeller}</button>
                <div id="contactBox" class="contact-box" style="display:none;">
                    <div class="contact-line">${esc(value)}</div>
                    <div class="actions">${buttons}</div>
                </div>`;
        }

        function render() {
            if (!current) return;
            const l = current;
            const o = l.owner || {};
            const tr = T[lang];
            const user = getUser();
            const unit = l.unit || "unit";
            const cat = CATS[l.category] ? CATS[l.category][lang] : l.category;
            const total = l.quantity ? `${esc(l.quantity)} ${esc(unit)}` : "-";
            const isMine = user && String(o.id) === String(user.uid || user.id);

            document.title = l.name + " - Qonna";
            document.getElementById("backLink").textContent = tr.back;
            document.getElementById("langBtn").textContent = tr.switchTo;

            box.className = "detail";
            box.innerHTML = `
                <span class="tag ${l.action === "sell" ? "sell" : "buy"}">${l.action === "sell" ? tr.sell : tr.buy}</span>
                <h2>${esc(l.name)}</h2>
                <div class="price-box">
                    <div class="amount">${esc(l.price)} ETB</div>
                    <div class="per">${tr.per} ${esc(unit)}</div>
                    <div class="total">${tr.total}: ${total}</div>
                </div>
                <div class="row"><b>${tr.cat}</b>${esc(cat)}</div>
                <div class="row"><b>${tr.details}</b>${esc(l.description || "-")}</div>
                <div class="row"><b>${tr.seller}</b>${esc(o.fullName || "-")}</div>
                <div class="row"><b>${tr.area}</b>${esc(o.subCity || "-")}</div>
                <div class="row"><b>${tr.posted}</b>${esc(l.createdAt || "-")}</div>
                ${contactSection(o.contact, tr)}`;

            const reveal = document.getElementById("revealBtn");
            if (reveal) {
                reveal.addEventListener("click", () => {
                    reveal.style.display = "none";
                    document.getElementById("contactBox").style.display = "block";
                });
            }

            renderOffer(user, isMine, unit);
        }

        function renderOffer(user, isMine, unit) {
            const tr = T[lang];
            if (isMine) {
                offerArea.innerHTML = `<div class="offer-box"><p>${tr.own}</p></div>`;
                return;
            }
            if (!user || !user.token) {
                offerArea.innerHTML = `<div class="offer-box"><p>${tr.login} <a href="login.html" style="color:#2E7D32;font-weight:bold;">${tr.loginLink}</a></p></div>`;
                return;
            }
            offerArea.innerHTML = `
                <div class="offer-box">
                    <h3>${tr.offerTitle}</h3>
                    <label for="kind">${tr.kind}</label>
                    <select id="kind">
                        <option value="offer">${tr.kindOffer}</option>
                        <option value="discount">${tr.kindDiscount}</option>
                    </select>
                    <label for="amount">${tr.amountLabel(esc(unit))}</label>
                    <input id="amount" type="number" min="1" step="any">
                    <label for="message">${tr.message}</label>
                    <textarea id="message" rows="3" maxlength="300"></textarea>
                    <button id="sendOffer" type="button">${tr.send}</button>
                    <div id="offerMsg" class="offer-msg"></div>
                </div>`;
            document.getElementById("sendOffer").addEventListener("click", sendOffer);
        }

        async function sendOffer() {
            const tr = T[lang];
            const user = getUser();
            const msgBox = document.getElementById("offerMsg");
            const btn = document.getElementById("sendOffer");
            btn.disabled = true;
            try {
                const res = await fetch(API + "/listings/" + encodeURIComponent(id) + "/offers", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + user.token },
                    body: JSON.stringify({
                        kind: document.getElementById("kind").value,
                        amount: document.getElementById("amount").value,
                        message: document.getElementById("message").value
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || tr.failed);
                msgBox.className = "offer-msg ok";
                msgBox.textContent = tr.sent;
                document.getElementById("amount").value = "";
                document.getElementById("message").value = "";
            } catch (e) {
                msgBox.className = "offer-msg bad";
                msgBox.textContent = e.message || tr.failed;
            } finally {
                btn.disabled = false;
            }
        }

        async function load() {
            if (!id) { show(T[lang].notFound); return; }
            show(T[lang].loading);
            try {
                const user = getUser();
                const headers = user && user.token ? { Authorization: "Bearer " + user.token } : {};
                const res = await fetch(API + "/listings", { headers });
                const data = await res.json();
                if (!res.ok) throw new Error("bad");
                const list = Array.isArray(data) ? data : (data.listings || data.data || []);
                current = list.find(x => String(x.id) === String(id)) || null;
                if (!current) { show(T[lang].notFound); return; }
                render();
            } catch (e) {
                show(T[lang].error);
            }
        }

        document.getElementById("langBtn").addEventListener("click", () => {
            lang = lang === "en" ? "om" : "en";
            sessionStorage.setItem("lang", lang);
            if (current) render();
            else document.getElementById("backLink").textContent = T[lang].back;
        });

        load();
    </script>
</body>
</html>
