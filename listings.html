<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Qonna Dijitaalawaa Shaggar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">🌱 Qonna Dijitaalawaa Shaggar</div>
        <div class="top-links">
            <button id="langBtn" class="btn-dash" style="border:none;cursor:pointer;">Afaan Oromoo</button>
            <a href="post-product.html" class="btn-dash" data-en="+ Post" data-om="+ Ergi">+ Post</a>
            <a href="index.html" class="btn-dash" data-en="Home" data-om="Mana">Home</a>
        </div>
    </div>

    <div class="container wide">
        <h2 data-en="Marketplace" data-om="Gabaa">Marketplace</h2>

        <div class="filters">
            <div style="display:flex;gap:8px;grid-column:1 / -1;">
                <input type="text" id="fSearch" style="flex:1;min-width:0;" data-en-ph="Search item..." data-om-ph="Meeshaa barbaadi..." placeholder="Search item...">
                <button type="button" id="searchBtn" class="btn-dash" style="border:none;cursor:pointer;font-size:14px;padding:12px 18px;white-space:nowrap;" data-en="Search" data-om="Barbaadi" onclick="document.getElementById('fSearch').dispatchEvent(new Event('input'))">Search</button>
            </div>
            <select id="fAction" class="dropdown">
                <option value="" data-en="Buy &amp; Sell" data-om="Hunda">Buy &amp; Sell</option>
                <option value="sell" data-en="For Sale" data-om="Gurgurtaaf">For Sale</option>
                <option value="buy" data-en="Wanted" data-om="Kan Barbaadamu">Wanted</option>
            </select>
            <select id="fCategory" class="dropdown">
                <option value="" data-en="All Categories" data-om="Ramaddii Hunda">All Categories</option>
                <option value="seeds" data-en="Seeds" data-om="Sanyii">Seeds</option>
                <option value="materials" data-en="Materials & Tools" data-om="Meeshaalee">Materials & Tools</option>
                <option value="fertilizer" data-en="Fertilizers" data-om="Xaa'oo">Fertilizers</option>
                <option value="produce" data-en="Fresh Harvest" data-om="Midhaan">Fresh Harvest</option>
            </select>
            <select id="fSubCity" class="dropdown">
                <option value="" data-en="All Sub-cities" data-om="Kutaa Hunda">All Sub-cities</option>
                <option value="melka_nono">Melka Nono</option>
                <option value="furi">Furi</option>
                <option value="sebeta">Sebeta</option>
                <option value="eka_tafo">Eka Tafo</option>
                <option value="galan">Galan</option>
                <option value="galan_guda">Galan Guda</option>
                <option value="gafarsa_guje">Gafarsa Guje</option>
                <option value="kura_jida">Kura Jida</option>
                <option value="koye_feche">Koye feche</option>
                <option value="mana_abichu">Mana Abichu</option>
                <option value="sululta">Sululta</option>
                <option value="burayu">Burayu</option>
            </select>
            <label><input type="checkbox" id="fMine"> <span data-en="My posts only" data-om="Kan koo qofa">My posts only</span></label>
        </div>

        <div id="listingsBox"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
